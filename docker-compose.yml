# Сайт чата для телефона и других компьютеров в домашней сети.
# Модель здесь не запущена: Ollama стоит на Windows и напрямую видит RTX 5070 Ti.
# Контейнер только показывает сайт и ходит в Ollama через host.docker.internal.

services:
  web:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      # 8080 внутри контейнера. Снаружи порт берётся из .env.
      - "${WEBUI_PORT:-8787}:8080"
    environment:
      # 11435 — локальный прокси: он выключает «размышление», иначе ответ часто пустой.
      OLLAMA_BASE_URL: http://host.docker.internal:11435
      WEBUI_NAME: "LocAI"
      # true: чужие чаты не видны. Логин похож на почту, письма не отправляются.
      WEBUI_AUTH: ${WEBUI_AUTH:-true}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      # Новые люди входят сразу, но не становятся администраторами.
      DEFAULT_USER_ROLE: user
      DEFAULT_MODELS: ${MODEL:-home-qwen}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Чаты и аккаунты живут на диске, не внутри контейнера.
      - ./data/webui:/app/backend/data
    restart: unless-stopped
